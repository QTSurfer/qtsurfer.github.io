name: Generate Redoc HTML

on:
  push:
    paths:
      - "openapi.yaml"
      - ".github/workflows/redoc_index.yml"
      - "redocly.yaml"
    branches:
      - main

jobs:
  generate-redoc:
    # This repository is mirrored, and the other host's CI also reads .github/workflows,
    # so without this guard both sides regenerate index.html independently and commit it,
    # leaving two content-identical commits that make the mirrors diverge on every spec
    # change. Generating in one place is what keeps them in step.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Redocly CLI
        run: npm install -g @redocly/cli@2.24.0

      - name: Lint OpenAPI spec
        run: redocly lint openapi.yaml

      - name: Generate HTML from OpenAPI
        run: redocly build-docs openapi.yaml --output=index.html

      - name: Commit HTML file
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: index.html
          commit_message: "chore: Updated OpenAPI HTML documentation"
