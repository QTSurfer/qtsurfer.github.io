  </defs>
  <text x="630" y="82" font-size="11" fill="#52514e">sharpe</text>
  <rect x="630" y="90" width="16" height="118" rx="2" fill="url(#seqBlue)"/>
  <text x="654" y="98" font-size="11" fill="#52514e">1.84</text>
  <text x="654" y="212" font-size="11" fill="#52514e">0.55</text>
