<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect x="0.5" y="0.5" width="719" height="319" rx="8" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>

  <text x="24" y="30" font-size="16" font-weight="600" fill="#0b0b0b">Mean Sharpe by rsiPeriod × useTrendFilter</text>
  <text x="24" y="50" font-size="12" fill="#52514e">Illustrative values — GET .../executeSweep/{requestId}/{sweepId}/sensitivity → heatmaps[0]</text>

  <!-- row 0: useTrendFilter = false -->
  <rect x="140" y="90" width="56" height="58" fill="#b7d3f6"/>
  <rect x="198" y="90" width="56" height="58" fill="#9ec5f4"/>
  <rect x="256" y="90" width="56" height="58" fill="#5598e7"/>
  <rect x="314" y="90" width="56" height="58" fill="#3987e5"/>
  <rect x="372" y="90" width="56" height="58" fill="#3987e5"/>
  <rect x="430" y="90" width="56" height="58" fill="#6da7ec"/>
  <rect x="488" y="90" width="56" height="58" fill="#b7d3f6"/>
  <rect x="546" y="90" width="56" height="58" fill="#cde2fb"/>

  <!-- row 1: useTrendFilter = true -->
  <rect x="140" y="150" width="56" height="58" fill="#6da7ec"/>
  <rect x="198" y="150" width="56" height="58" fill="#2a78d6"/>
  <rect x="256" y="150" width="56" height="58" fill="#184f95"/>
  <rect x="314" y="150" width="56" height="58" fill="#0d366b"/>
  <rect x="372" y="150" width="56" height="58" fill="#104281"/>
  <rect x="430" y="150" width="56" height="58" fill="#256abf"/>
  <rect x="488" y="150" width="56" height="58" fill="#6da7ec"/>
  <rect x="546" y="150" width="56" height="58" fill="#9ec5f4"/>

  <!-- best cell: rsiPeriod=16, useTrendFilter=true -->
  <rect x="313" y="149" width="58" height="60" fill="none" stroke="#0b0b0b" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="342" y="184" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">1.84</text>

  <!-- row labels -->
  <text x="130" y="123" font-size="12" fill="#52514e" text-anchor="end">false</text>
  <text x="130" y="183" font-size="12" fill="#52514e" text-anchor="end">true</text>
  <text x="50" y="149" font-size="12" fill="#52514e" text-anchor="middle" transform="rotate(-90 50 149)">useTrendFilter</text>

  <!-- column ticks -->
  <text x="168" y="224" font-size="11" fill="#898781" text-anchor="middle">7</text>
  <text x="226" y="224" font-size="11" fill="#898781" text-anchor="middle">10</text>
  <text x="284" y="224" font-size="11" fill="#898781" text-anchor="middle">13</text>
  <text x="342" y="224" font-size="11" fill="#898781" text-anchor="middle">16</text>
  <text x="400" y="224" font-size="11" fill="#898781" text-anchor="middle">19</text>
  <text x="458" y="224" font-size="11" fill="#898781" text-anchor="middle">22</text>
  <text x="516" y="224" font-size="11" fill="#898781" text-anchor="middle">25</text>
  <text x="574" y="224" font-size="11" fill="#898781" text-anchor="middle">28</text>
  <text x="371" y="244" font-size="12" font-weight="600" fill="#52514e" text-anchor="middle">rsiPeriod</text>

  <!-- colorbar legend -->
  <defs>
    <linearGradient id="seqBlue" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#cde2fb"/>
      <stop offset="25%" stop-color="#86b6ef"/>
      <stop offset="50%" stop-color="#3987e5"/>
      <stop offset="75%" stop-color="#1c5cab"/>
      <stop offset="100%" stop-color="#0d366b"/>
